<title>JEE / BITSAT Test Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light;
    --page:        #f4f4f0;
    --surface:     #ffffff;
    --surface-2:   #fbfaf7;
    --ink-1:       #15171c;
    --ink-2:       #54565f;
    --ink-3:       #85868f;
    --hairline:    rgba(21,23,28,0.09);
    --hairline-2:  rgba(21,23,28,0.14);
    --accent:      #33429b;
    --accent-wash: rgba(51,66,155,0.08);
    --advanced:    #9a3fb5;
    --advanced-wash: rgba(154,63,181,0.10);
    --bitsat:      #0f7a8c;
    --bitsat-wash: rgba(15,122,140,0.10);
    --good:        #0ca30c;
    --critical:    #d03b3b;
    --muted-status:#898781;
    --warning:     #b9750a;
    --phy:         #2a78d6;
    --chem:        #eb6834;
    --math:        #1baf7a;
    --eng:         #c9930a;
    --iq:          #c05a86;
    --shadow:      0 1px 2px rgba(21,23,28,0.06), 0 8px 24px -12px rgba(21,23,28,0.18);
    --remark-bg:   #fbf6e9;
    --remark-edge: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:        #101216;
      --surface:     #1a1d24;
      --surface-2:   #20232b;
      --ink-1:       #f0efe9;
      --ink-2:       #b7b7b3;
      --ink-3:       #83848c;
      --hairline:    rgba(240,239,233,0.09);
      --hairline-2:  rgba(240,239,233,0.15);
      --accent:      #8b97ec;
      --accent-wash: rgba(139,151,236,0.14);
      --advanced:    #dd8fea;
      --advanced-wash: rgba(221,143,234,0.14);
      --bitsat:      #45c2d6;
      --bitsat-wash: rgba(69,194,214,0.14);
      --good:        #17c317;
      --critical:    #e66767;
      --muted-status:#9c9b95;
      --warning:     #e0a53a;
      --phy:         #3987e5;
      --chem:        #e2793f;
      --math:        #22c98a;
      --eng:         #e0ac2f;
      --iq:          #e388ae;
      --shadow:      0 1px 2px rgba(0,0,0,0.3), 0 8px 28px -12px rgba(0,0,0,0.55);
      --remark-bg:   #23200f;
      --remark-edge: #c99a2e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #101216; --surface: #1a1d24; --surface-2: #20232b;
    --ink-1: #f0efe9; --ink-2: #b7b7b3; --ink-3: #83848c;
    --hairline: rgba(240,239,233,0.09); --hairline-2: rgba(240,239,233,0.15);
    --accent: #8b97ec; --accent-wash: rgba(139,151,236,0.14);
    --advanced: #dd8fea; --advanced-wash: rgba(221,143,234,0.14);
    --bitsat: #45c2d6; --bitsat-wash: rgba(69,194,214,0.14);
    --good: #17c317; --critical: #e66767; --muted-status: #9c9b95; --warning: #e0a53a;
    --phy: #3987e5; --chem: #e2793f; --math: #22c98a; --eng: #e0ac2f; --iq: #e388ae;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px -12px rgba(0,0,0,0.55);
    --remark-bg: #23200f; --remark-edge: #c99a2e;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #f4f4f0; --surface: #ffffff; --surface-2: #fbfaf7;
    --ink-1: #15171c; --ink-2: #54565f; --ink-3: #85868f;
    --hairline: rgba(21,23,28,0.09); --hairline-2: rgba(21,23,28,0.14);
    --accent: #33429b; --accent-wash: rgba(51,66,155,0.08);
    --advanced: #9a3fb5; --advanced-wash: rgba(154,63,181,0.10);
    --bitsat: #0f7a8c; --bitsat-wash: rgba(15,122,140,0.10);
    --good: #0ca30c; --critical: #d03b3b; --muted-status: #898781; --warning: #b9750a;
    --phy: #2a78d6; --chem: #eb6834; --math: #1baf7a; --eng: #c9930a; --iq: #c05a86;
    --shadow: 0 1px 2px rgba(21,23,28,0.06), 0 8px 24px -12px rgba(21,23,28,0.18);
    --remark-bg: #fbf6e9; --remark-edge: #c99a2e;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; width: 100%; }
  body {
    background: var(--page); color: var(--ink-1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 400; text-wrap: balance; color: var(--ink-1);
  }
  .num, .tabular { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace; font-variant-numeric: tabular-nums; }
  button { font: inherit; }

  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }

  .rail {
    background: var(--surface); border-right: 1px solid var(--hairline);
    padding: 20px 14px; display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .rail-brand { padding: 4px 8px 18px; border-bottom: 1px solid var(--hairline); margin-bottom: 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .rail-close-btn { display: none; }
  .rail-brand .eyebrow { font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 4px; }
  .rail-brand h1 { font-size: 18px; margin: 0; line-height: 1.25; }
  .rail-group-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3);
    padding: 12px 10px 4px; font-weight: 700;
  }
  .rail-item {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink-2);
  }
  .rail-item:hover { background: var(--surface-2); }
  .rail-item[aria-selected="true"] { background: var(--accent-wash); border-color: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--ink-1); }
  .rail-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rail-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ink-3); }
  .rail-item .rt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .rail-item .rt .label { font-size: 13px; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail-item .rt .sub { font-size: 10.5px; color: var(--ink-3); }
  .rail-item .score-chip { margin-left: auto; font-size: 10.5px; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); flex: none; }
  .rail-foot { margin-top: auto; padding: 10px 8px 2px; font-size: 10.5px; color: var(--ink-3); border-top: 1px solid var(--hairline); }

  .console { padding: 30px 40px 80px; max-width: 1180px; min-width: 0; }
  .panel { display: none; }
  .panel.active { display: block; }

  .console-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 20px; margin-bottom: 22px; border-bottom: 1px solid var(--hairline); flex-wrap: wrap; }
  .console-head h2 { font-size: 26px; margin: 0 0 6px; }
  .console-head .meta { color: var(--ink-2); font-size: 13.5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .meta .dot-sep::before { content: "·"; margin-right: 10px; color: var(--ink-3); }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em; padding: 3px 9px 3px 7px; border-radius: 100px; border: 1px solid transparent; }
  .badge.main { background: var(--accent-wash); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .badge.advanced { background: var(--advanced-wash); color: var(--advanced); border-color: color-mix(in srgb, var(--advanced) 35%, transparent); }
  .badge.bitsat { background: var(--bitsat-wash); color: var(--bitsat); border-color: color-mix(in srgb, var(--bitsat) 35%, transparent); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .info-pill { font-size: 12px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 8px; padding: 8px 12px; max-width: 340px; line-height: 1.45; }

  .kpi-row { display: grid; grid-template-columns: repeat(var(--kpi-cols, 6), 1fr); gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); border-radius: 12px; overflow: hidden; margin-bottom: 26px; box-shadow: var(--shadow); }
  .kpi { background: var(--surface); padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; }
  .kpi .v { font-size: 20px; font-weight: 600; }
  .kpi .v.good { color: var(--good); } .kpi .v.critical { color: var(--critical); }
  .kpi .l { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.01em; }

  .section-title { font-size: 15px; margin: 0 0 3px; }
  .section-sub { font-size: 12.5px; color: var(--ink-3); margin: 0 0 14px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 26px; }
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 18px 20px 14px; box-shadow: var(--shadow); }
  .card.wide { grid-column: 1 / -1; }
  #panel-overview .card.wide { margin-bottom: 24px; }
  .panel.subject-overview .card.wide { margin-bottom: 24px; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend-line { width: 14px; height: 2px; border-radius: 2px; flex: none; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; border: 1.5px solid var(--surface); }
  .legend-square { width: 9px; height: 9px; border-radius: 2px; flex: none; border: 1.5px solid var(--surface); }
  .legend-triangle { width: 11px; height: 10px; flex: none; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
  .legend.legend-sm { gap: 10px; margin-top: 6px; font-size: 10px; }
  .legend.legend-sm .legend-item { gap: 4px; }
  .legend.legend-sm .legend-swatch { width: 7px; height: 7px; }
  .legend.legend-sm .legend-line { width: 10px; height: 1.5px; }
  .legend.legend-sm .legend-dot, .legend.legend-sm .legend-square { width: 6.5px; height: 6.5px; }
  .legend.legend-sm .legend-triangle { width: 8px; height: 7px; }

  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .grid-line { stroke: var(--hairline); stroke-width: 1; }
  .axis-line { stroke: var(--hairline-2); stroke-width: 1; }
  .axis-label { fill: var(--ink-3); font-size: 10.5px; font-family: ui-monospace, monospace; }
  .cat-label { fill: var(--ink-2); font-size: 11px; }
  .bar-mark { cursor: pointer; transition: opacity .12s ease; }
  .bar-mark:hover, .bar-mark.hovered { opacity: 0.82; }
  .bar-value { fill: var(--ink-1); font-size: 10.5px; font-weight: 600; font-family: ui-monospace, monospace; }
  .line-mark { fill: none; stroke-width: 2.5; }
  .hit-target { fill: transparent; cursor: pointer; }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; opacity: 0; }

  #tooltip {
    position: fixed; z-index: 60; pointer-events: none; background: var(--surface);
    border: 1px solid var(--hairline-2); border-radius: 8px; box-shadow: var(--shadow);
    padding: 8px 11px; font-size: 12px; color: var(--ink-2); opacity: 0;
    transform: translate(-50%, calc(-100% - 10px)); transition: opacity .08s ease; max-width: 250px;
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tt-title { color: var(--ink-1); font-weight: 600; margin-bottom: 4px; font-size: 12.5px; }
  #tooltip .tt-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  #tooltip .tt-key { display: flex; align-items: center; gap: 6px; }
  #tooltip .tt-swatch { width: 9px; height: 2px; border-radius: 2px; flex: none; }
  #tooltip .tt-val { color: var(--ink-1); font-weight: 700; font-family: ui-monospace, monospace; }

  .remarks { background: var(--remark-bg); border: 1px solid color-mix(in srgb, var(--remark-edge) 35%, transparent); border-left: 3px solid var(--remark-edge); border-radius: 10px; padding: 20px 22px 22px; margin-bottom: 26px; }
  .remarks-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .remarks-head .eyebrow { font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--remark-edge); font-weight: 700; }
  .remarks-head .powered { font-size: 11px; color: var(--ink-3); }
  .remarks h3.headline { font-size: 17px; margin: 2px 0 16px; color: var(--ink-1); }
  .remarks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 16px; }
  .remarks-col h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 8px; color: var(--ink-2); font-family: inherit; font-weight: 700; }
  .remarks-col ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.55; color: var(--ink-1); }
  .remarks-col ul.strengths li::marker { color: var(--good); }
  .remarks-col ul.weaknesses li::marker { color: var(--critical); }
  .note-block { background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.55; color: var(--ink-1); margin-bottom: 12px; }
  .note-block .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; color: var(--advanced); display: block; margin-bottom: 5px; }
  .note-block.rank .tag { color: var(--bitsat); }
  .note-block.errorcode .tag { color: var(--critical); }
  .concept-suggest { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .cs-item { display: flex; gap: 10px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px; padding: 10px 12px; }
  .cs-item .cs-name { font-size: 12.5px; font-weight: 700; color: var(--ink-1); flex: 0 0 150px; }
  .cs-item .cs-text { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  .action-plan { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .action-plan li { display: flex; gap: 9px; font-size: 13px; line-height: 1.5; color: var(--ink-1); }
  .action-plan .chk { flex: none; width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--remark-edge); margin-top: 1px; }
  .note-bullets { margin: 0; padding-left: 16px; }
  .note-bullets li { margin-bottom: 2px; }
  .note-bullets li:last-child { margin-bottom: 0; }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.data-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--hairline-2); cursor: pointer; user-select: none; white-space: nowrap; }
  table.data-table th.num, table.data-table td.num { text-align: right; }
  .summary-table-card table.data-table td.num { text-align: center; }
  .concept-table-card table.data-table td.num { text-align: center; }
  .subject-table-card table.data-table td.num { text-align: center; }
  table.data-table th:hover { color: var(--ink-1); }
  table.data-table td { padding: 8px 10px; border-bottom: 1px solid var(--hairline); color: var(--ink-2); }
  table.data-table td.strong { color: var(--ink-1); font-weight: 600; }
  table.data-table tr.row-main td { background: var(--accent-wash); }
  table.data-table tr.row-advanced td { background: var(--advanced-wash); }
  table.data-table tr.row-bitsat td { background: var(--bitsat-wash); }
  table.data-table tr.row-subj-phy td { background: color-mix(in srgb, var(--phy) 12%, transparent); }
  table.data-table tr.row-subj-chem td { background: color-mix(in srgb, var(--chem) 12%, transparent); }
  table.data-table tr.row-subj-math td { background: color-mix(in srgb, var(--math) 12%, transparent); }
  table.data-table tr.row-subj-eng td { background: color-mix(in srgb, var(--eng) 12%, transparent); }
  table.data-table tr.row-subj-iq td { background: color-mix(in srgb, var(--iq) 12%, transparent); }
  table.data-table tr:hover td { background: var(--surface-2); }
  .subject-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .acc-chip { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; }
  .acc-chip.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .acc-chip.warn { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }
  .acc-chip.bad { background: color-mix(in srgb, var(--critical) 15%, transparent); color: var(--critical); }
  .acc-chip.na { background: var(--hairline); color: var(--ink-3); }

  .table-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 26px; overflow-x: auto; }
  .table-card.table-card-flush { padding: 0; overflow: hidden; }
  .table-card.table-card-flush table.data-table th:first-child,
  .table-card.table-card-flush table.data-table td:first-child { padding-left: 10px; }
  .table-card.table-card-flush table.data-table th:last-child,
  .table-card.table-card-flush table.data-table td:last-child { padding-right: 10px; }
  .table-card.table-card-flush table.data-table th { padding-top: 14px; padding-bottom: 14px; text-align: center; font-weight: 700; color: var(--ink-1); }
  .table-card.table-card-flush table.data-table td:first-child.strong { font-weight: 400; }
  .table-card-title { text-align: center; font-size: 15px; font-weight: 700; color: var(--ink-1); padding: 16px 16px 12px; }
  .table-card.table-card-flush table.data-table tr:last-child td { border-bottom: none; }

  .pattern-strip { display: flex; gap: 14px; margin-bottom: 26px; flex-wrap: wrap; }
  .pattern-fact { flex: 1; min-width: 220px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 13px 15px; box-shadow: var(--shadow); }
  .pattern-fact .pf-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); margin-bottom: 4px; }
  .pattern-fact .pf-val { font-size: 12.5px; color: var(--ink-1); line-height: 1.5; }

  .untracked-note { font-size: 11.5px; color: var(--ink-3); background: var(--surface-2); border: 1px dashed var(--hairline-2); border-radius: 6px; padding: 6px 10px; margin-top: 8px; }

  /* ---------- Mobile top bar + collapsible rail drawer ---------- */
  .mobile-topbar { display: none; }
  .rail-backdrop { display: none; }

  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); display: block; }
    .mobile-topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; background: var(--surface); border-bottom: 1px solid var(--hairline);
      position: sticky; top: 0; z-index: 40;
    }
    .hamburger-btn {
      flex: none; width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid var(--hairline); background: var(--surface-2);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      cursor: pointer; padding: 0;
    }
    .hamburger-btn span { display: block; width: 16px; height: 2px; border-radius: 1px; background: var(--ink-2); }
    .hamburger-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .mt-titlewrap { min-width: 0; flex: 1; }
    .mobile-topbar .mt-title { font-size: 14px; font-weight: 600; color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mobile-topbar .mt-sub { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .rail-close-btn {
      display: flex; align-items: center; justify-content: center;
      flex: none; width: 30px; height: 30px; border-radius: 8px;
      border: 1px solid var(--hairline); background: var(--surface-2); color: var(--ink-2);
      font-size: 20px; line-height: 1; cursor: pointer; padding: 0;
    }

    .rail-backdrop {
      display: block; position: fixed; inset: 0; background: rgba(10,10,12,0.45);
      z-index: 65; opacity: 0; pointer-events: none; transition: opacity .2s ease;
    }
    .rail-backdrop.open { opacity: 1; pointer-events: auto; }

    .rail {
      position: fixed; top: 0; left: 0; height: 100vh; width: 82%; max-width: 300px;
      transform: translateX(-100%); transition: transform .25s ease;
      z-index: 70; box-shadow: 0 0 0 1px var(--hairline), 8px 0 24px -8px rgba(0,0,0,0.35);
      min-width: 0;
    }
    .rail.open { transform: translateX(0); }
    .rail-item { flex: none; }
    .console { padding: 18px 14px 50px; min-width: 0; }
    .grid-2 { grid-template-columns: 1fr; }
    .remarks-grid { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .kpi { padding: 12px 10px; }
    .kpi .v { font-size: 18px; }
    .cs-item { flex-direction: column; gap: 3px; }
    .cs-item .cs-name { flex: none; }
    /* Tighten tables so they fit the screen width without horizontal scroll. */

<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("dashboard-data").textContent);
  var SVGNS = "http://www.w3.org/2000/svg";

  var SUBJECT_VAR = { Physics: "phy", Chemistry: "chem", Maths: "math", English: "eng", IQ: "iq" };
  var SUBJECT_HEX_LIGHT = { Physics: "#2a78d6", Chemistry: "#eb6834", Maths: "#1baf7a", English: "#c9930a", IQ: "#c05a86" };
  var SUBJECT_ORDER = ["Physics", "Chemistry", "Maths", "English", "IQ"];
  var PATTERN_VAR = { "JEE Main": "accent", "JEE Advanced": "advanced", "BITSAT": "bitsat" };
  var PATTERN_SHAPE = { "JEE Main": "circle", "JEE Advanced": "square", "BITSAT": "triangle" };
  var PATTERN_BADGE_CLASS = { "JEE Main": "main", "JEE Advanced": "advanced", "BITSAT": "bitsat" };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }
  function text(tag, className, str) {
    var n = el(tag, { class: className || "" });
    n.textContent = str;
    return n;
  }
  function svg(tag, attrs) {
    var node = document.createElementNS(SVGNS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    return node;
  }
  function fmtPct(v) { return v === null || v === undefined ? "—" : (Math.round(v * 10) / 10) + "%"; }
  function accClass(acc) { if (acc === null || acc === undefined) return "na"; return acc >= 85 ? "good" : acc >= 60 ? "warn" : "bad"; }

  var ttEl = document.getElementById("tooltip");
  function showTooltip(x, y, titleText, rows) {
    ttEl.innerHTML = "";
    var title = el("div", { class: "tt-title" }); title.textContent = titleText; ttEl.appendChild(title);
    rows.forEach(function (r) {
      var row = el("div", { class: "tt-row" });
      var key = el("div", { class: "tt-key" });
      if (r.color) { var sw = el("span", { class: "tt-swatch" }); sw.style.background = r.color; key.appendChild(sw); }
      var kt = document.createElement("span"); kt.textContent = r.label; key.appendChild(kt);
      var val = el("span", { class: "tt-val" }); val.textContent = r.value;
      row.appendChild(key); row.appendChild(val); ttEl.appendChild(row);
    });
    ttEl.style.left = x + "px"; ttEl.style.top = y + "px"; ttEl.classList.add("show");
  }
  function hideTooltip() { ttEl.classList.remove("show"); }

  var LEGEND_SWATCH_CLASS = {
    line: "legend-line", dot: "legend-dot", circle: "legend-dot",
    square: "legend-square", triangle: "legend-triangle",
  };
  function legendItem(color, label, kind) {
    var item = el("div", { class: "legend-item" });
    var sw = el("span", { class: LEGEND_SWATCH_CLASS[kind] || "legend-swatch" });
    sw.style.background = color;
    item.appendChild(sw);
    var lab = document.createElement("span"); lab.textContent = label; item.appendChild(lab);
    return item;
  }

  // ---------------- Marker shapes for line-chart data points ----------------
  function drawMarker(shape, cx, cy, r, fill, strokeWidth) {
    var attrs = { fill: fill, stroke: "var(--surface)", "stroke-width": strokeWidth };
    if (shape === "square") {
      var side = r * 1.7;
      return svg("rect", Object.assign({ x: cx - side / 2, y: cy - side / 2, width: side, height: side, rx: 2 }, attrs));
    }
    if (shape === "triangle") {
      var R = r * 1.25;
      var pts = [
        [cx, cy - R],
        [cx + R * 0.866, cy + R * 0.5],
        [cx - R * 0.866, cy + R * 0.5],
      ].map(function (p) { return p[0].toFixed(2) + "," + p[1].toFixed(2); }).join(" ");
      return svg("polygon", Object.assign({ points: pts }, attrs));
    }
    return svg("circle", Object.assign({ cx: cx, cy: cy, r: r }, attrs));
  }

  // ---------------- Subject score/max bar chart (handles untracked) ----------------
  function subjectScoreChart(container, subjects) {
    var W = 560, H = 260, padL = 46, padR = 10, padT = 34, padB = 44;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var s = svg("svg", { class: "chart", width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Score by subject" });
    var n = subjects.length, bw = plotW / n * 0.5;
    var maxVal = Math.max.apply(null, subjects.map(function (r) { return r.maxScore || 0; })) || 1;
    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
      var y = padT + plotH * (1 - f);
      s.appendChild(svg("line", { class: f === 0 ? "axis-line" : "grid-line", x1: padL, x2: W - padR, y1: y, y2: y }));
      var lab = svg("text", { class: "axis-label", x: padL - 8, y: y + 4, "text-anchor": "end", style: "font-size:14px;" });
      lab.textContent = Math.round(maxVal * f);
      s.appendChild(lab);
    });
    subjects.forEach(function (row, i) {
      var cx = padL + plotW * (i + 0.5) / n;
      var val = row.score || 0;
      var h = Math.max(2, plotH * (val / maxVal));
      var x = cx - bw / 2, y = padT + plotH - h;
      var color = "var(--" + SUBJECT_VAR[row.subject] + ")";
      var rect = svg("rect", { class: "bar-mark", x: x, y: y, width: bw, height: h, rx: 4, fill: color });
      s.appendChild(rect);
      var vlab = svg("text", { class: "bar-value", x: cx, y: y - 10, "text-anchor": "middle", style: "font-size:17px;" });
      vlab.textContent = val + "/" + row.maxScore;
      s.appendChild(vlab);
      var clab = svg("text", { class: "cat-label", x: cx, y: H - 10, "text-anchor": "middle", style: "font-size:17px;" });
      clab.textContent = row.subject + (row.tracked ? "" : " *");
      s.appendChild(clab);
      var hit = svg("rect", { class: "hit-target", x: cx - plotW / n / 2, y: padT, width: plotW / n, height: plotH });
      s.appendChild(hit);
      function activate(evt) {
        rect.classList.add("hovered");
        var pt = evt.touches ? evt.touches[0] : evt;
        var rows = [
          { label: "Score", value: val + " / " + row.maxScore, color: color },
          { label: "% of max", value: fmtPct(row.pctOfMax) },
        ];
        if (row.subjectRank !== null && row.subjectRank !== undefined) rows.push({ label: "Subject rank", value: "#" + row.subjectRank });
        if (row.tracked) rows.push({ label: "Right / Wrong / Unatt.", value: row.right + " / " + row.wrong + " / " + row.unattempted });
        else rows.push({ label: "Detail", value: "not tracked" });
        showTooltip(pt.clientX, pt.clientY, row.subject, rows);
      }
      hit.addEventListener("pointermove", activate);
      hit.addEventListener("pointerenter", activate);
      hit.addEventListener("pointerleave", function () { rect.classList.remove("hovered"); hideTooltip(); });
      hit.setAttribute("tabindex", "0");
      hit.addEventListener("focus", activate);
      hit.addEventListener("blur", function () { rect.classList.remove("hovered"); hideTooltip(); });
    });
    container.appendChild(s);
    if (subjects.some(function (r) { return !r.tracked; })) {
      container.appendChild(el("div", { class: "untracked-note" }, [document.createTextNode(
        "* score/rank is real; question-level right/wrong detail isn't tracked for this section in the source data.")]));
    }
  }

  // ---------------- Rank by subject (lower bar = better rank) ----------------
  function subjectRankChart(container, subjects, overallRank) {
    var ranked = subjects.filter(function (r) { return r.subjectRank !== null && r.subjectRank !== undefined; });
    if (!ranked.length) {
      container.appendChild(el("div", { class: "untracked-note" }, [document.createTextNode(
        "No per-subject rank reported for this test.")]));
      return;
    }
    var hasOverall = overallRank !== null && overallRank !== undefined;
    var W = 560, H = 260, padL = 46, padR = 10, padT = 34, padB = 44;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var s = svg("svg", { class: "chart", width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Rank by subject" });
    var n = ranked.length, bw = plotW / n * 0.5;
    var vals = ranked.map(function (r) { return r.subjectRank; });
    if (hasOverall) vals.push(overallRank);
    var maxVal = Math.max.apply(null, vals) || 1;
    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
      var y = padT + plotH * (1 - f);
      s.appendChild(svg("line", { class: f === 0 ? "axis-line" : "grid-line", x1: padL, x2: W - padR, y1: y, y2: y }));
      var lab = svg("text", { class: "axis-label", x: padL - 8, y: y + 4, "text-anchor": "end", style: "font-size:14px;" });
      lab.textContent = Math.round(maxVal * f);
      s.appendChild(lab);
    });
    ranked.forEach(function (row, i) {
      var cx = padL + plotW * (i + 0.5) / n;
      var val = row.subjectRank;
      var h = Math.max(2, plotH * (val / maxVal));
      var x = cx - bw / 2, y = padT + plotH - h;
      var color = "var(--" + SUBJECT_VAR[row.subject] + ")";
      var rect = svg("rect", { class: "bar-mark", x: x, y: y, width: bw, height: h, rx: 4, fill: color });
      s.appendChild(rect);
      var vlab = svg("text", { class: "bar-value", x: cx, y: y - 10, "text-anchor": "middle", style: "font-size:17px;" });
      vlab.textContent = "#" + val;
      s.appendChild(vlab);
      var clab = svg("text", { class: "cat-label", x: cx, y: H - 10, "text-anchor": "middle", style: "font-size:17px;" });
      clab.textContent = row.subject;
      s.appendChild(clab);
      var hit = svg("rect", { class: "hit-target", x: cx - plotW / n / 2, y: padT, width: plotW / n, height: plotH });
      s.appendChild(hit);
      function activate(evt) {
        rect.classList.add("hovered");
        var pt = evt.touches ? evt.touches[0] : evt;
        showTooltip(pt.clientX, pt.clientY, row.subject, [
          { label: "Rank", value: "#" + val, color: color },
          { label: "Score", value: row.score + " / " + row.maxScore },
        ]);
      }
      hit.addEventListener("pointermove", activate);
      hit.addEventListener("pointerenter", activate);
      hit.addEventListener("pointerleave", function () { rect.classList.remove("hovered"); hideTooltip(); });
      hit.setAttribute("tabindex", "0");
      hit.addEventListener("focus", activate);
      hit.addEventListener("blur", function () { rect.classList.remove("hovered"); hideTooltip(); });
    });
    if (hasOverall) {
      var ly = padT + plotH - plotH * (overallRank / maxVal);
      s.appendChild(svg("line", {
        x1: padL, x2: W - padR, y1: ly, y2: ly,
        stroke: "var(--ink-2)", "stroke-width": 1.5, "stroke-dasharray": "6,4",
      }));
      var labelText = "Overall #" + overallRank;
      var estW = labelText.length * 7.4 + 10;
      var lx = W - padR, ltY = ly - 8;
      s.appendChild(svg("rect", {
        x: lx - estW, y: ltY - 13, width: estW, height: 18, rx: 4,
        fill: "var(--surface)", stroke: "var(--hairline-2)", "stroke-width": 1,
      }));
      var llab = svg("text", {
        x: lx - 6, y: ltY, "text-anchor": "end",
        style: "font-size:13px;font-weight:700;fill:var(--ink-2);",
      });
      llab.textContent = labelText;
      s.appendChild(llab);
    }
    container.appendChild(s);
    container.appendChild(el("div", { class: "untracked-note" }, [document.createTextNode("Lower bar = better rank." + (hasOverall ? " Dashed line = overall rank." : ""))]));
    if (ranked.length < subjects.length) {
      var missing = subjects.filter(function (r) { return r.subjectRank === null || r.subjectRank === undefined; }).map(function (r) { return r.subject; }).join(", ");
      container.appendChild(el("div", { class: "untracked-note" }, [document.createTextNode("No rank reported for: " + missing)]));
    }
  }

  // ---------------- Right/Wrong/Unattempted stacked bar (tracked subjects only) ----------------
  function statusStackChart(container, subjects) {
    var tracked = subjects.filter(function (r) { return r.tracked; });
    if (!tracked.length) {
      container.appendChild(el("div", { class: "untracked-note" }, [document.createTextNode(
        "No question-level mistake tracking available for this test's subjects.")]));
      return;
    }
    var W = 560, H = 260, padL = 40, padR = 10, padT = 20, padB = 44;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var s = svg("svg", { class: "chart", width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Right, wrong, unattempted by subject" });
    var n = tracked.length, bw = plotW / n * 0.5;
    var maxTotal = Math.max.apply(null, tracked.map(function (r) { return r.totalQ; })) || 1;
    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
      var y = padT + plotH * (1 - f);
      s.appendChild(svg("line", { class: f === 0 ? "axis-line" : "grid-line", x1: padL, x2: W - padR, y1: y, y2: y }));
      var lab = svg("text", { class: "axis-label", x: padL - 8, y: y + 4, "text-anchor": "end", style: "font-size:14px;" });
      lab.textContent = Math.round(maxTotal * f);
      s.appendChild(lab);
    });
    var order = [["right", "Right", "good"], ["wrong", "Wrong", "critical"], ["unattempted", "Unattempted", "muted-status"]];
    tracked.forEach(function (row, i) {
      var cx = padL + plotW * (i + 0.5) / n;
      var x = cx - bw / 2;
      var yCursor = padT + plotH;
      order.forEach(function (spec) {
        var key = spec[0], val = row[key];
        var h = plotH * (val / maxTotal);
        if (h <= 0) return;
        var y = yCursor - h;
        var rect = svg("rect", { class: "bar-mark", x: x, y: y, width: bw, height: h, fill: "var(--" + spec[2] + ")" });
        s.appendChild(rect);
        var hit = svg("rect", { class: "hit-target", x: x, y: y, width: bw, height: h });
        s.appendChild(hit);
        (function (label, val, rect) {
          function activate(evt) {
            rect.classList.add("hovered");
            var pt = evt.touches ? evt.touches[0] : evt;
            showTooltip(pt.clientX, pt.clientY, row.subject + " — " + label, [{ label: "Questions", value: val + " of " + row.totalQ }]);
          }
          hit.addEventListener("pointermove", activate);
          hit.addEventListener("pointerenter", activate);
          hit.addEventListener("pointerleave", function () { rect.classList.remove("hovered"); hideTooltip(); });
          hit.setAttribute("tabindex", "0");
          hit.addEventListener("focus", activate);
          hit.addEventListener("blur", function () { rect.classList.remove("hovered"); hideTooltip(); });
        })(spec[1], val, rect);
        yCursor = y - 2;
      });
      var clab = svg("text", { class: "cat-label", x: cx, y: H - 10, "text-anchor": "middle", style: "font-size:17px;" });
      clab.textContent = row.subject;
      s.appendChild(clab);
    });
    container.appendChild(s);

      legendItem("var(--good)", "Right", "sw"), legendItem("var(--critical)", "Wrong", "sw"), legendItem("var(--muted-status)", "Unattempted", "sw")
    ]));

      var missing = subjects.filter(function (r) { return !r.tracked; }).map(function (r) { return r.subject; }).join(", ");
      container.appendChild(el("div", { class: "untracked-note" }, [document.createTextNode("Not shown (untracked): " + missing)]));
    }
  }

  // ---------------- Generic line chart (supports per-point pattern-colored markers) ----------------
  function lineChart(container, xLabels, series, opts) {
    opts = opts || {};
    var W = 1080, H = 260, padL = opts.padL || 42, padR = opts.padR || 16, padT = 20, padB = 34;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var s = svg("svg", { class: "chart", width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": opts.ariaLabel || "Trend chart" });
    var allVals = [];
    series.forEach(function (sr) { sr.values.forEach(function (v) { if (v !== null && v !== undefined) allVals.push(v); }); });
    var invert = !!opts.invert;
    var minV = opts.min !== undefined ? opts.min : Math.min(0, Math.min.apply(null, allVals));
    var maxV = opts.max !== undefined ? opts.max : Math.max.apply(null, allVals) * 1.15;
    var n = xLabels.length;

    });
    var codes = Object.values(byCode).sort(function (a, b) { return b.total - a.total; });

        min: 0, max: 75, yTicks: [0, 0.2, 0.4, 0.6, 0.8, 1],
        ariaLabel: "Rank trend", valueFmt: function (v, i) { return "#" + v; },
        titleFmt: function (i) { return tests[i].dateLabel + " — " + tests[i].pattern; },
        legend: patterns.map(function (p) { return { color: "var(--" + PATTERN_VAR[p] + ")", label: p, kind: PATTERN_SHAPE[p] }; }),
        yAxisFontSize: 20, yAxisFill: "var(--ink-1)",
        xAxisFontSize: 17, xAxisFill: "var(--ink-1)", padL: 46, padR: 50, dotRadius: 9, smallLegend: true,
      });

    var accCard = el("div", { class: "card wide" }, [
      text("div", "section-title", "Subject-wise Percentage Trend"),
    ]);
    var accChart = el("div"); accCard.appendChild(accChart);
    panel.appendChild(accCard);
    var xLabels = tests.map(function (t) { return t.paperId; });
    lineChart(accChart, xLabels, ["Physics", "Chemistry", "Maths"].map(function (subj) {
      return {
        name: subj, color: "var(--" + SUBJECT_VAR[subj] + ")",
        values: tests.map(function (t) {
          var row = t.subjects.filter(function (s) { return s.subject === subj; })[0];
          return row ? row.pctOfMax : null;
        })
      };
    }), {
      min: 0, max: 100, suffix: "%", ariaLabel: "Subject percentage trend",
      yAxisFontSize: 20, yAxisFill: "var(--ink-1)",
      xAxisFontSize: 17, xAxisFill: "var(--ink-1)", padL: 46, padR: 50,
    });

    var subjRankCard = el("div", { class: "card wide" }, [
      text("div", "section-title", "Subject-wise Rank Trend"),
    ]);
    var subjRankChart = el("div"); subjRankCard.appendChild(subjRankChart);
    panel.appendChild(subjRankCard);
    var subjRankSeries = ["Physics", "Chemistry", "Maths"].map(function (subj) {
      return {
        name: subj, color: "var(--" + SUBJECT_VAR[subj] + ")",
        values: tests.map(function (t) {
          var row = t.subjects.filter(function (s) { return s.subject === subj; })[0];
          return row && row.subjectRank !== null && row.subjectRank !== undefined ? row.subjectRank : null;
        })
      };
    });
    var allSubjRanks = subjRankSeries.reduce(function (acc, sr) { return acc.concat(sr.values.filter(function (v) { return v !== null; })); }, []);
    lineChart(subjRankChart, xLabels, subjRankSeries, {
      min: Math.min.apply(null, allSubjRanks) - 3, max: Math.max.apply(null, allSubjRanks) + 3,
      ariaLabel: "Subject rank trend", valueFmt: function (v) { return "#" + v; },
      yAxisFontSize: 20, yAxisFill: "var(--ink-1)",
      xAxisFontSize: 17, xAxisFill: "var(--ink-1)", padL: 46, padR: 50,
    });

    var allErrorCodes = [];
    tests.forEach(function (t) { (t.errorCodes || []).forEach(function (e) { allErrorCodes.push(e); }); });
    var ecCard = el("div", { class: "card wide" }, [
      text("div", "section-title", "Mistakes by Error Code"),
    ]);
    var ecChart = el("div"); ecCard.appendChild(ecChart);
    panel.appendChild(ecCard);
    errorCodeChart(ecChart, allErrorCodes, {
      yAxisFontSize: 20, yAxisFill: "var(--ink-1)", xAxisFontSize: 21, xAxisBold: true, padL: 46, H: 420,
      padB: 50, labelGap: 30,
    });

    var summaryCard = el("div", { class: "table-card table-card-flush summary-table-card" });
    summaryCard.appendChild(text("div", "table-card-title", "Summary"));
    var t = el("table", { class: "data-table" });
    t.appendChild(el("thead", {}, [(function () {
      var tr = el("tr");
      ["Test", "Pattern", "Score", "Percent", "Rank"].forEach(function (h, idx) {
        var th = el("th", { class: idx >= 2 ? "num" : "" }); th.textContent = h; tr.appendChild(th);
      });
      return tr;
    })()]));
    var tbody = el("tbody");
    tests.forEach(function (r) {
      var tr = el("tr", { class: "row-" + (PATTERN_BADGE_CLASS[r.pattern] || "main") });
      tr.appendChild(el("td", { class: "strong" }, [document.createTextNode(r.paperId)]));
      var tdP = el("td"); tdP.textContent = r.pattern; tr.appendChild(tdP);
      var tdScore = el("td", { class: "num strong" }); tdScore.textContent = r.overall.score + "/" + r.overall.maxScore; tr.appendChild(tdScore);
      var tdPct = el("td", { class: "num" });
      var chip = el("span", { class: "acc-chip " + accClass(r.overall.pctOfMax) }); chip.textContent = fmtPct(r.overall.pctOfMax);
      tdPct.appendChild(chip); tr.appendChild(tdPct);
      var tdRank = el("td", { class: "num" }); tdRank.textContent = r.overall.rank !== null ? "#" + r.overall.rank : "—"; tr.appendChild(tdRank);
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    summaryCard.appendChild(t);
    panel.appendChild(summaryCard);

    var remarks = remarksBlock(DATA.overallInsights, "Cross-Pattern");
    if (remarks) panel.appendChild(remarks);

    return panel;
  }

  // ---------------- Subject Overview panels (Physics / Chemistry / Maths) ----------------
  function buildSubjectOverviewPanel(subject) {
    var slug = subject.toLowerCase();
    var subjColor = "var(--" + SUBJECT_VAR[subject] + ")";
    var panel = el("section", { class: "panel subject-overview", id: "panel-" + slug + "-overview", role: "tabpanel" });
    var tests = DATA.tests;
    var patterns = Array.from(new Set(tests.map(function (t) { return t.pattern; })));
    var xLabels = tests.map(function (t) { return t.paperId; });
    function subjRow(t) { return t.subjects.filter(function (s) { return s.subject === subject; })[0]; }

    var head = el("div", { class: "console-head" }, [
      el("div", {}, [
        text("h2", "", subject + " Overview"),
        el("div", { class: "meta" }, [
          text("span", "", tests.length + " tests"),
          text("span", "dot-sep", tests[0].dateLabel + " – " + tests[tests.length - 1].dateLabel),
        ]),
      ])
    ]);
    panel.appendChild(head);

    var subjPct = tests.map(function (t) { var r = subjRow(t); return r ? r.pctOfMax : null; }).filter(function (v) { return v !== null && v !== undefined; });
    var avgPct = subjPct.reduce(function (a, b) { return a + b; }, 0) / subjPct.length;
    var rankData = tests.map(function (t) {
      var r = subjRow(t);
      return { test: t, rank: r && r.subjectRank !== null && r.subjectRank !== undefined ? r.subjectRank : null };
    });
    var ranked = rankData.filter(function (x) { return x.rank !== null; });
    var bestRank = ranked.length ? ranked.slice().sort(function (a, b) { return a.rank - b.rank; })[0] : null;
    var latestRank = rankData[rankData.length - 1];

    panel.appendChild(kpiRow([
      { value: tests.length, label: "Tests Taken" },
      { value: fmtPct(avgPct), label: "Avg Percentage" },
      { value: bestRank ? "#" + bestRank.rank : "—", label: "Best Rank" + (bestRank ? " (" + bestRank.test.paperId + ")" : "") },
      { value: latestRank.rank !== null ? "#" + latestRank.rank : "—", label: "Most Recent Rank" },
    ]));

    var trendCard = el("div", { class: "card wide" }, [
      text("div", "section-title", subject + " Percentage Trend"),
    ]);
    var trendChart = el("div"); trendCard.appendChild(trendChart);
    panel.appendChild(trendCard);
    lineChart(trendChart, xLabels,
      [{
        name: subject, color: subjColor,
        values: tests.map(function (t) { var r = subjRow(t); return r ? r.pctOfMax : null; }),
        pointColors: tests.map(function (t) { return "var(--" + PATTERN_VAR[t.pattern] + ")"; }),
        pointShapes: tests.map(function (t) { return PATTERN_SHAPE[t.pattern]; }),
      }],
      {
        min: 0, max: 100, suffix: "%", ariaLabel: subject + " percentage trend",
        yAxisFontSize: 20, yAxisFill: "var(--ink-1)",
        xAxisFontSize: 17, xAxisFill: "var(--ink-1)", padL: 46, padR: 50, dotRadius: 9, smallLegend: true,
        valueFmt: function (v, i) { var r = subjRow(tests[i]); return r ? v + "% (" + r.score + "/" + r.maxScore + ")" : v + "%"; },
        titleFmt: function (i) { return tests[i].dateLabel + " — " + tests[i].pattern; },
        legend: patterns.map(function (p) { return { color: "var(--" + PATTERN_VAR[p] + ")", label: p, kind: PATTERN_SHAPE[p] }; }),
      });

    var rankCard = el("div", { class: "card wide" }, [
      text("div", "section-title", subject + " Rank Trend"),
    ]);
    var rankChart = el("div"); rankCard.appendChild(rankChart);
    panel.appendChild(rankCard);
    var rankVals = ranked.map(function (x) { return x.rank; });
    lineChart(rankChart, xLabels,
      [{
        name: subject, color: subjColor,
        values: rankData.map(function (x) { return x.rank; }),
        pointColors: tests.map(function (t) { return "var(--" + PATTERN_VAR[t.pattern] + ")"; }),
        pointShapes: tests.map(function (t) { return PATTERN_SHAPE[t.pattern]; }),
      }],
      {
        min: 0, max: Math.max.apply(null, rankVals) + 3,
        ariaLabel: subject + " rank trend", valueFmt: function (v) { return "#" + v; },
        titleFmt: function (i) { return tests[i].dateLabel + " — " + tests[i].pattern; },
        legend: patterns.map(function (p) { return { color: "var(--" + PATTERN_VAR[p] + ")", label: p, kind: PATTERN_SHAPE[p] }; }),
        yAxisFontSize: 20, yAxisFill: "var(--ink-1)",
        xAxisFontSize: 17, xAxisFill: "var(--ink-1)", padL: 46, padR: 50, dotRadius: 9, smallLegend: true,
      });

    var subjErrorCodes = [];
    tests.forEach(function (t) { (t.errorCodes || []).forEach(function (e) { if (e.subject === subject) subjErrorCodes.push(e); }); });
    var ecCard = el("div", { class: "card wide" }, [
      text("div", "section-title", subject + " — Mistakes by Error Code"),
    ]);
    var ecChart = el("div"); ecCard.appendChild(ecChart);
    panel.appendChild(ecCard);
    errorCodeChart(ecChart, subjErrorCodes, {
      yAxisFontSize: 20, yAxisFill: "var(--ink-1)", xAxisFontSize: 21, xAxisBold: true, padL: 46, H: 420,
      padB: 50, labelGap: 30,
    });

    var byKey = {};
    tests.forEach(function (t) {
      t.concepts.forEach(function (c) {
        if (c.subject !== subject) return;
        if (!byKey[c.concept]) byKey[c.concept] = { concept: c.concept, subject: subject, wrong: 0, unattempted: 0 };
        byKey[c.concept].wrong += c.wrong;
        byKey[c.concept].unattempted += c.unattempted;
      });
    });
    panel.appendChild(conceptTable(Object.values(byKey), true));

    var subjRemarks = shortRemarksBlock(DATA[slug + "Insights"], subject + " Examiner's Remarks");
    if (subjRemarks) panel.appendChild(subjRemarks);

    return panel;
  }

  var RAIL_META = {};

  function buildRail() {
    var rail = document.getElementById("rail");
    var brandRow = el("div", { class: "rail-brand" }, [
      el("div", {}, [text("p", "eyebrow", "Exam Console"), text("h1", "", "Monday Test Series")]),
    ]);
    var closeBtn = el("button", { class: "rail-close-btn", "aria-label": "Close menu" }, []);
    closeBtn.innerHTML = "&times;";
    closeBtn.addEventListener("click", closeRail);
    brandRow.appendChild(closeBtn);
    rail.appendChild(brandRow);

    RAIL_META.overview = { title: "Overview", sub: DATA.tests.length + " tests" };
    var btn0 = el("button", { class: "rail-item", role: "tab", "aria-selected": "true", "data-target": "overview" }, [
      el("span", { class: "rail-dot" }), el("div", { class: "rt" }, [text("span", "label", "Overview"), text("span", "sub", DATA.tests.length + " tests")])
    ]);
    btn0.addEventListener("click", function () { selectPanel("overview"); });
    rail.appendChild(btn0);

    ["Physics", "Chemistry", "Maths"].forEach(function (subject) {
      var target = subject.toLowerCase() + "-overview";
      var label = subject + " Overview";
      RAIL_META[target] = { title: label, sub: DATA.tests.length + " tests" };
      var btnSubj = el("button", { class: "rail-item", role: "tab", "aria-selected": "false", "data-target": target }, [
        el("span", { class: "rail-dot" }), el("div", { class: "rt" }, [text("span", "label", label), text("span", "sub", DATA.tests.length + " tests")])
      ]);
      btnSubj.addEventListener("click", function () { selectPanel(target); });
      rail.appendChild(btnSubj);
    });

    var groups = {};
    DATA.tests.forEach(function (t) { (groups[t.pattern] = groups[t.pattern] || []).push(t); });
    Object.keys(groups).forEach(function (pattern) {
      rail.appendChild(text("div", "rail-group-label", pattern));
      groups[pattern].slice().reverse().forEach(function (t) {
        var id = cssId(t.paperId);
        var suffixMatch = t.paperId.match(/(P\d+)$/);
        var railLabel = t.dateLabel + (suffixMatch ? " (" + suffixMatch[1] + ")" : "");
        RAIL_META[id] = { title: railLabel, sub: t.pattern + " · Rank #" + (t.overall.rank !== null ? t.overall.rank : "—") };
        var btn = el("button", { class: "rail-item", role: "tab", "aria-selected": "false", "data-target": id }, [
          el("span", { class: "rail-dot" }),
          el("div", { class: "rt" }, [text("span", "label", railLabel), text("span", "sub", "Rank #" + (t.overall.rank !== null ? t.overall.rank : "—"))]),
          text("span", "score-chip num", fmtPct(t.overall.pctOfMax))
        ]);
        btn.addEventListener("click", function () { selectPanel(id); });
        rail.appendChild(btn);
      });
    });
    rail.appendChild(el("div", { class: "rail-foot" }, [document.createTextNode(DATA.generatedFor)]));
  }

  function buildMobileChrome() {
    var app = document.querySelector(".app");
    var backdrop = el("div", { class: "rail-backdrop", id: "rail-backdrop" });
    backdrop.addEventListener("click", closeRail);

    var hamburger = el("button", { class: "hamburger-btn", id: "hamburger-btn", "aria-label": "Open test menu", "aria-expanded": "false", "aria-controls": "rail" }, [
      el("span", {}), el("span", {}), el("span", {})
    ]);
    hamburger.addEventListener("click", function () {
      if (document.getElementById("rail").classList.contains("open")) closeRail(); else openRail();
    });
    var titleWrap = el("div", { class: "mt-titlewrap" }, [
      text("div", "mt-title", "Overview"), text("div", "mt-sub", DATA.tests.length + " tests")
    ]);
    var topbar = el("div", { class: "mobile-topbar", id: "mobile-topbar" }, [hamburger, titleWrap]);

    app.insertBefore(topbar, app.firstChild);
    app.insertBefore(backdrop, app.firstChild);

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeRail();
    });
  }

  function openRail() {
    document.getElementById("rail").classList.add("open");
    document.getElementById("rail-backdrop").classList.add("open");
    document.getElementById("hamburger-btn").setAttribute("aria-expanded", "true");
  }
  function closeRail() {
    var rail = document.getElementById("rail");
    var backdrop = document.getElementById("rail-backdrop");
    var hamburger = document.getElementById("hamburger-btn");
    if (rail) rail.classList.remove("open");
    if (backdrop) backdrop.classList.remove("open");
    if (hamburger) hamburger.setAttribute("aria-expanded", "false");
  }

  function selectPanel(id) {
    document.querySelectorAll(".rail-item").forEach(function (b) { b.setAttribute("aria-selected", b.getAttribute("data-target") === id ? "true" : "false"); });
    document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
    var target = document.getElementById(id === "overview" ? "panel-overview" : "panel-" + id);
    if (target) target.classList.add("active");
    var meta = RAIL_META[id];
    if (meta) {
      var titleEl = document.querySelector("#mobile-topbar .mt-title");
      var subEl = document.querySelector("#mobile-topbar .mt-sub");
      if (titleEl) titleEl.textContent = meta.title;
      if (subEl) subEl.textContent = meta.sub;
    }
    closeRail();
    window.scrollTo(0, 0);
  }

  function init() {
    buildRail();
    buildMobileChrome();
    var consoleEl = document.getElementById("console");
    consoleEl.appendChild(buildOverviewPanel());
    ["Physics", "Chemistry", "Maths"].forEach(function (subject) { consoleEl.appendChild(buildSubjectOverviewPanel(subject)); });
    DATA.tests.forEach(function (t) { consoleEl.appendChild(buildTestPanel(t)); });
  }
  init();
})();
</script>
