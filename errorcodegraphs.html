  * { box-sizing: border-box; }

  .card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; flex-wrap: wrap; }

  .card-total b { color: var(--ink-1); font-variant-numeric: tabular-nums; }

  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .grid-line { stroke: var(--hairline); stroke-width: 1; }
  .axis-line { stroke: var(--hairline-2); stroke-width: 1; }

  .cat-label { fill: var(--ink-2); }
  .bar-value { fill: var(--ink-1); font-family: ui-monospace, monospace; }
  .bar-mark { cursor: pointer; transition: opacity .12s ease; }
  .bar-mark:hover, .bar-mark.hovered { opacity: 0.82; }
  .hit-target { fill: transparent; cursor: pointer; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  #tooltip {
    position: fixed; z-index: 60; pointer-events: none; background: var(--surface);
    border: 1px solid var(--hairline-2); border-radius: 8px; box-shadow: var(--shadow);
    padding: 8px 11px; font-size: 12px; color: var(--ink-2); opacity: 0;
    transform: translate(-50%, calc(-100% - 10px)); transition: opacity .08s ease; max-width: 250px;

  #tooltip.show { opacity: 1; }

  #tooltip .tt-val { color: var(--ink-1); font-weight: 700; font-family: ui-monospace, monospace; }

  .empty-note { font-size: 12px; color: var(--ink-3); padding: 20px; text-align: center; }

  @media (max-width: 640px) {
    .wrap { padding: 18px 14px 50px; }

  }

<script>
(function () {
  var DATA = JSON.parse(document.getElementById("dashboard-data").textContent);
  var SVGNS = "http://www.w3.org/2000/svg";
  var SUBJECT_ORDER = ["Physics", "Chemistry", "Maths"];
  var SUBJECT_VAR = { Physics: "phy", Chemistry: "chem", Maths: "math" };

  function el(tag, attrs, children) {

    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }
  function text(tag, className, str) {
    var n = el(tag, { class: className || "" });
    n.textContent = str;
    return n;
  }
  function svg(tag, attrs) {
    var node = document.createElementNS(SVGNS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    return node;
  }

  var ttEl = document.getElementById("tooltip");
  function showTooltip(x, y, titleText, rows) {
    ttEl.innerHTML = "";
    var title = el("div", { class: "tt-title" }); title.textContent = titleText; ttEl.appendChild(title);
    rows.forEach(function (r) {
      var row = el("div", { class: "tt-row" });
      var key = el("div", { class: "tt-key" });
      if (r.color) { var sw = el("span", { class: "tt-swatch" }); sw.style.background = r.color; key.appendChild(sw); }
      var kt = document.createElement("span"); kt.textContent = r.label; key.appendChild(kt);
      var val = el("span", { class: "tt-val" }); val.textContent = r.value;
      row.appendChild(key); row.appendChild(val); ttEl.appendChild(row);
    });
    ttEl.style.left = x + "px"; ttEl.style.top = y + "px"; ttEl.classList.add("show");
  }
  function hideTooltip() { ttEl.classList.remove("show"); }

  function legendItem(color) {
    var item = el("div", { class: "legend-item" });
    var sw = el("span", { class: "legend-swatch" });
    sw.style.background = color;
    item.appendChild(sw);
    return item;
  }

  var tests = DATA.tests;
  document.getElementById("meta").textContent =
    tests.length + " tests · " + tests[0].dateLabel + " – " + tests[tests.length - 1].dateLabel +
    " · totals across all codes, then one chart per error code, bars split by subject, x-axis = test (Paper ID)";

  // Union of every error code that appears at least once, with its total mistake count.
  // "W"-prefixed codes are mistakes made while attempting; "N"-prefixed codes are reasons
  // nothing was answered (i.e. unattempted).
  var byCode = {};
  tests.forEach(function (t) {
    (t.errorCodes || []).forEach(function (e) {
      if (!byCode[e.code]) byCode[e.code] = { code: e.code, label: e.label, total: 0 };
      byCode[e.code].total += e.count;
    });
  });
  var codes = Object.values(byCode).sort(function (a, b) { return b.total - a.total; });

  var chartsEl = document.getElementById("charts");
  if (!codes.length) {
    chartsEl.appendChild(el("div", { class: "empty-note" }, [document.createTextNode("No error codes logged.")]));
    return;
  }

  function sumMatching(matchFn) {
    var total = 0;
    tests.forEach(function (t) { (t.errorCodes || []).forEach(function (e) { if (matchFn(e)) total += e.count; }); });
    return total;
  }

  function addCard(codeText, labelText, matchFn) {
    var card = el("div", { class: "card" });
    var head = el("div", { class: "card-head" }, [
      el("span", { class: "card-code" }, [document.createTextNode(codeText)]),
      el("span", { class: "card-label" }, [document.createTextNode(labelText)]),
      el("span", { class: "card-total" }, [document.createTextNode("Total"), document.createElement("br")]),
    ]);
    var totalStrong = document.createElement("b");
    totalStrong.textContent = " " + sumMatching(matchFn);
    head.lastChild.appendChild(totalStrong);
    card.appendChild(head);

    var chartWrap = el("div");
    card.appendChild(chartWrap);
    chartsEl.appendChild(card);

    buildChart(chartWrap, matchFn, labelText);
  }

  addCard("ALL", "Total Errors (all wrong-attempt codes combined)", function (e) { return e.code.charAt(0) === "W"; });
  addCard("ALL", "Total Unattempted (all no-answer codes combined)", function (e) { return e.code.charAt(0) === "N"; });

  codes.forEach(function (codeInfo) {
    addCard(codeInfo.code, codeInfo.label, function (e) { return e.code === codeInfo.code; });
  });

  function buildChart(container, matchFn, label) {
    var series = tests.map(function (t) {
      var bySubj = {};
      (t.errorCodes || []).forEach(function (e) {
        if (matchFn(e)) bySubj[e.subject] = (bySubj[e.subject] || 0) + e.count;
      });
      var total = SUBJECT_ORDER.reduce(function (s, su) { return s + (bySubj[su] || 0); }, 0);
      return { paperId: t.paperId, dateLabel: t.dateLabel, bySubj: bySubj, total: total };
    });

    var padL = 46, padR = 16, W = 1080, H = 300, padT = 34, padB = 54;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var n = series.length, bw = plotW / n * 0.5;
    var maxTotal = Math.max.apply(null, series.map(function (s) { return s.total; })) || 1;
    var s = svg("svg", {
      class: "chart", width: W, height: H, viewBox: "0 0 " + W + " " + H,
      role: "img", "aria-label": label + " mistakes by test",
    });

    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
      var y = padT + plotH * (1 - f);
      s.appendChild(svg("line", { class: f === 0 ? "axis-line" : "grid-line", x1: padL, x2: W - padR, y1: y, y2: y }));
      var lab = svg("text", { class: "axis-label", x: padL - 8, y: y + 4, "text-anchor": "end", style: "font-size:13px;" });
      lab.textContent = Math.round(maxTotal * f);
      s.appendChild(lab);
    });

    series.forEach(function (row, i) {
      var cx = padL + plotW * (i + 0.5) / n;
      var x = cx - bw / 2;
      var yCursor = padT + plotH;
      SUBJECT_ORDER.forEach(function (subj) {
        var val = row.bySubj[subj];
        if (!val) return;
        var h = plotH * (val / maxTotal);
        var y = yCursor - h;
        var color = "var(--" + SUBJECT_VAR[subj] + ")";
        var rect = svg("rect", { class: "bar-mark", x: x, y: y, width: bw, height: h, fill: color });
        s.appendChild(rect);
        var hit = svg("rect", { class: "hit-target", x: x, y: y, width: bw, height: h });
        s.appendChild(hit);
        (function (subj, val, rect, color) {
          function activate(evt) {
            rect.classList.add("hovered");
            var pt = evt.touches ? evt.touches[0] : evt;
            showTooltip(pt.clientX, pt.clientY, row.paperId, [{ label: subj, value: val, color: color }]);
          }
          hit.addEventListener("pointermove", activate);
          hit.addEventListener("pointerenter", activate);
          hit.addEventListener("pointerleave", function () { rect.classList.remove("hovered"); hideTooltip(); });
          hit.setAttribute("tabindex", "0");
          hit.addEventListener("focus", activate);
          hit.addEventListener("blur", function () { rect.classList.remove("hovered"); hideTooltip(); });
        })(subj, val, rect, color);
        yCursor = y - 2;
      });

      if (row.total > 0) {
        var vlab = svg("text", {
          class: "bar-value", x: cx, y: padT + plotH - plotH * (row.total / maxTotal) - 10, "text-anchor": "middle",
          style: "font-size:16px;font-weight:800;",
        });
        vlab.textContent = row.total;
        s.appendChild(vlab);
      }
      var clab = svg("text", { class: "cat-label", x: cx, y: H - padB + 22, "text-anchor": "middle", style: "font-size:12px;" });
      clab.textContent = row.paperId;
      s.appendChild(clab);
    });

    container.appendChild(s);
    var legend = el("div", { class: "legend" });
    SUBJECT_ORDER.forEach(function (subj) {
      var item = legendItem("var(--" + SUBJECT_VAR[subj] + ")");
      item.appendChild(document.createTextNode(subj));
      legend.appendChild(item);
    });
    container.appendChild(legend);
  }
})();
